services:
  telegram-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATA_DIR: /data
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_PHONE: ${TG_PHONE:-}
      TG_BOT_NAME: ${TG_BOT_NAME:-}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-}
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST in .env}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - telegram-data:/data
volumes:
  telegram-data:
