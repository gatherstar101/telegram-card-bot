name: telegram-card-bot-github
services:
  telegram-api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 6m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3100
      AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET:?Set AUTH_HMAC_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_AUTH_MAX_FAILURES: ${ADMIN_AUTH_MAX_FAILURES:-2}
      ADMIN_IP_BAN_SECONDS: ${ADMIN_IP_BAN_SECONDS:-3600}
      AUTH_CHALLENGE_TTL_SECONDS: ${AUTH_CHALLENGE_TTL_SECONDS:-600}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-7200}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-telegram-bot:}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_PHONE: ${TG_PHONE:-}
      TG_BOT_NAME: ${TG_BOT_NAME:-}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-}
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_AUTO_CREATE_DATABASE: ${DB_AUTO_CREATE_DATABASE:-true}
      DB_SCHEMA_INIT: ${DB_SCHEMA_INIT:-true}
      DB_SCHEMA_LOCK_TIMEOUT_SECONDS: ${DB_SCHEMA_LOCK_TIMEOUT_SECONDS:-60}
      DB_MAINTENANCE_DATABASE: ${DB_MAINTENANCE_DATABASE:-postgres}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CREDENTIAL_KEYS: ${CREDENTIAL_KEYS:?Set CREDENTIAL_KEYS in .env}
      CREDENTIAL_KEY_ID: ${CREDENTIAL_KEY_ID:?Set CREDENTIAL_KEY_ID in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OTP_IP_QPS: ${OTP_IP_QPS:-1}
      API_IP_PER_MINUTE: ${API_IP_PER_MINUTE:-120}
      API_USER_PER_MINUTE: ${API_USER_PER_MINUTE:-60}
      WEBHOOK_IP_PER_MINUTE: ${WEBHOOK_IP_PER_MINUTE:-1200}
      TG_LOGIN_PER_TEN_MINUTES: ${TG_LOGIN_PER_TEN_MINUTES:-5}
      TG_CREATE_PER_TEN_MINUTES: ${TG_CREATE_PER_TEN_MINUTES:-10}
      MAX_TG_ACCOUNTS_PER_USER: ${MAX_TG_ACCOUNTS_PER_USER:-5}
      MAX_BOTS_PER_USER: ${MAX_BOTS_PER_USER:-20}
      MAX_CHANNELS_PER_USER: ${MAX_CHANNELS_PER_USER:-50}
      MAX_TG_APPS_PER_USER: ${MAX_TG_APPS_PER_USER:-5}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-10}
      MAX_ACTIVE_WORKFLOWS_PER_USER: ${MAX_ACTIVE_WORKFLOWS_PER_USER:-2}
      BUSINESS_EVENT_RETENTION_DAYS: ${BUSINESS_EVENT_RETENTION_DAYS:-90}
      RAW_UPDATE_RETENTION_DAYS: ${RAW_UPDATE_RETENTION_DAYS:-7}
      TRACKING_LINK_TTL_SECONDS: ${TRACKING_LINK_TTL_SECONDS:-86400}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-60}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-240}
      JOB_QUEUE_LIMIT: ${JOB_QUEUE_LIMIT:-20}
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-604800}
      WEBHOOK_CHAT_PER_MINUTE: ${WEBHOOK_CHAT_PER_MINUTE:-5}
      WEBHOOK_BOT_PER_MINUTE: ${WEBHOOK_BOT_PER_MINUTE:-300}
      WEBHOOK_QUEUE_LIMIT: ${WEBHOOK_QUEUE_LIMIT:-500}
      WEBHOOK_RETENTION_SECONDS: ${WEBHOOK_RETENTION_SECONDS:-604800}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-1000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
    volumes:
      - telegram-data:/data
volumes:
  telegram-data:
