name: Cloudflare API checks
on:
  push:
    branches: [feature-cfworker]
  pull_request:
    paths:
      - cfworker/**
      - auto-register/**
      - .github/workflows/cfworker-check.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cfworker/package-lock.json
            auto-register/package-lock.json
      - run: npm ci
        working-directory: cfworker
      - run: npm ci
        working-directory: auto-register
      - run: npm run check
      - run: npm test
        working-directory: auto-register
      - run: npm run build
        working-directory: cfworker
